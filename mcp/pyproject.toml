[project]
name = "qdrust-mcp"
# Kept in sync by scripts/bump-version.py --check (same single source of truth
# as the Cargo / webui / OpenAPI versions).
version = "0.1.23"
description = "MCP server for a qdrust instance: create, run and inspect HTTP automation tasks from any MCP client"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
    # Not >=1.10: older SDKs import `pydantic._internal._typing_extra
    # .eval_type_backport`, which modern pydantic no longer has, so they cannot
    # even be imported in a fresh environment. 1.22 is the oldest release the
    # tests pass against, and ci.yml re-checks that floor on every push.
    "mcp>=1.22,<2",
]

[project.scripts]
qdrust-mcp = "qdrust_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qdrust_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # 构建 multi-arch 镜像并推送到 Docker Hub + GHCR
  image:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # 登录 GHCR
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 登录 Docker Hub（需配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN）
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME }}/qdrust
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  # 发布前门禁：本地构建单个平台 -> 冒烟测试 -> trivy 扫描
  smoke:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: qdrust:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: |
          docker run -d --name qdrust-smoke -p 8923:8923 qdrust:smoke
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8923/ready && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8923/health
          curl --fail --silent http://127.0.0.1:8923/
          docker logs qdrust-smoke
      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: qdrust:smoke
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

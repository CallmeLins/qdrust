name: ci

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Cargo / webui package / OpenAPI versions must agree (see
      # scripts/bump-version.py, the single entry point for version bumps).
      - run: python3 scripts/bump-version.py --check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # A migration that already shipped may not change: sqlx checksums each file
  # and every deployment that ran it will refuse to start. See
  # scripts/check-migrations.py for why a comment counts as content.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needs the release tags to know what has already shipped, so the
          # default single-commit clone is not enough.
          fetch-depth: 0
      - run: python3 scripts/check-migrations.py

  # MySQL is the backend the unit tests cannot reach: they all run on SQLite, so
  # every MySQL-only trap is invisible to `cargo test` -- the second migration
  # tree drifting from the first, a reserved word that needs backticks, and the
  # absence of foreign keys, which makes every "it cascades" assumption wrong.
  #
  # Three things are checked: the two migration trees describe the same schema,
  # the binary boots against MySQL, and a task deleted through the API really
  # takes its runs and steps with it (no cascade would have done that for us).
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: qdrust-ci
          MYSQL_DATABASE: qdrust_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pqdrust-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MYSQL_PASSWORD: qdrust-ci
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: The two migration trees describe one schema
        run: python3 scripts/check-schema-parity.py --mysql-host 127.0.0.1 --mysql-user root

      - name: Boot, run and delete against MySQL
        run: |
          set -euo pipefail
          cargo build --bin qdrust-server
          DATABASE_URL='mysql://root:qdrust-ci@127.0.0.1:3306/qdrust_ci' \
            PORT=18923 \
            QDRUST_LOCAL_LOGIN_ENABLED=true \
            RUST_LOG=warn \
            ./target/debug/qdrust-server &
          server=$!
          trap 'kill $server || true' EXIT

          BASE=http://127.0.0.1:18923
          for _ in $(seq 1 60); do
            if curl -fsS "$BASE/ready" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS "$BASE/ready" >/dev/null

          # Register + login exercises LAST_INSERT_ID and the session writes.
          curl -fsS -X POST "$BASE/api/v1/auth/register" \
            -H 'Content-Type: application/json' \
            -d '{"username":"cismoke","password":"ci-smoke-password"}' >/dev/null
          curl -fsS -c jar.txt -X POST "$BASE/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"username":"cismoke","password":"ci-smoke-password"}' >/dev/null
          csrf=$(awk '$6=="qd_csrf"{print $7}' jar.txt)

          # Reading a run selects `trigger`, which is a reserved word on MySQL and
          # needs backticks: this call is what fails without them.
          curl -fsS -b jar.txt -X POST "$BASE/api/v1/tasks" \
            -H 'Content-Type: application/json' -H "x-csrf-token: $csrf" \
            -d '{"name":"ci","cron":"0 */5 * * * * *","method":"GET","url":"http://127.0.0.1:18923/health"}' >/dev/null
          curl -fsS -b jar.txt -X POST "$BASE/api/v1/tasks/1/run" -H "x-csrf-token: $csrf" >/dev/null

          for _ in $(seq 1 60); do
            status=$(curl -fsS -b jar.txt "$BASE/api/v1/tasks/1/runs" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["status"])')
            case "$status" in succeeded|failed|cancelled) break ;; esac
            sleep 1
          done
          test "$status" = succeeded

          curl -fsS -b jar.txt -X DELETE "$BASE/api/v1/tasks/1" -H "x-csrf-token: $csrf" >/dev/null

          # The point of the exercise: MySQL has no foreign keys here, so if the
          # delete path forgot a child table the rows are simply still there.
          for table in runs run_steps notification_deliveries notification_actions; do
            left=$(mysql --host=127.0.0.1 --user=root --password=qdrust-ci --protocol=TCP \
              --batch --skip-column-names --execute="SELECT COUNT(*) FROM qdrust_ci.$table")
            if [ "$left" != "0" ]; then
              echo "::error::$table still holds $left row(s) after the task was deleted"
              exit 1
            fi
          done

  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm run generate:api
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Generated client is current
        run: git diff --exit-code -- src/generated/api.ts

  # The Python MCP server (mcp/): nothing to compile, so CI only needs uv, ruff
  # and the tests — one of which spawns the server over stdio and lists tools.
  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pytest -q

      # `uv sync` above always resolves the newest SDK, so it can never tell an
      # uninstallable floor from a good one. This is the half that keeps the
      # promise in pyproject.toml honest — on the oldest Python we support, too.
      - name: Oldest supported mcp SDK
        run: |
          uv venv --python 3.10 .venv-floor
          # `--no-deps` applies to the whole command, so the project goes in
          # alone: the next line is what decides the SDK version.
          uv pip install --python .venv-floor/bin/python -e . --no-deps
          uv pip install --python .venv-floor/bin/python 'mcp==1.22.*' pytest
          .venv-floor/bin/python -m pytest -q

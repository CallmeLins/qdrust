[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2023-0071 (rsa): Marvin Attack timing side-channel. Pulled in
# transitively by sqlx-mysql for caching_sha2_password auth; no patched rsa
# release is pinned by sqlx yet. Local deployments are unaffected (the server
# initiates TLS to MySQL and the auth exchange is not attacker-controlled).
# RUSTSEC-2026-0387 (crypto-bigint 0.5.5): several operations documented as
# constant-time can branch on secret data. The fix is 0.7.6, a major bump, and
# 0.5.5 is not avoidable from here: it arrives through
# openidconnect -> p256/p384 -> elliptic-curve 0.13 -> crypto-bigint 0.5, and
# 4.0.1 declares p256/p384 as unconditional dependencies with no feature gate.
# Everything that reaches it is ES256/ES384 *verification*
# (`openidconnect::core::crypto` builds an `ecdsa::VerifyingKey` and calls
# `verify`), so the values flowing through these branches are the signature and
# the provider's public JWKS -- both public. This tree never loads an EC private
# scalar: the only signing keys openidconnect implements are RSA, HMAC and
# Ed25519, and none of them are used here. Revisit when openidconnect moves to
# elliptic-curve 0.14 (which pulls crypto-bigint 0.7).
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0387"]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

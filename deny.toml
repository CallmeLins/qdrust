[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2023-0071 (rsa): Marvin Attack timing side-channel. Pulled in
# transitively by sqlx-mysql for caching_sha2_password auth; no patched rsa
# release is pinned by sqlx yet. Local deployments are unaffected (the server
# initiates TLS to MySQL and the auth exchange is not attacker-controlled).
ignore = ["RUSTSEC-2023-0071"]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

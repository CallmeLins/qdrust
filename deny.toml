[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2023-0071 (rsa): Marvin Attack timing side-channel. Pulled in
# transitively by sqlx-mysql for caching_sha2_password auth; no patched rsa
# release is pinned by sqlx yet. Local deployments are unaffected (the server
# initiates TLS to MySQL and the auth exchange is not attacker-controlled).
# RUSTSEC-2026-0387 (crypto-bigint 0.5.5): several operations documented as
# constant-time can branch on secret data. The fix is 0.7.6, a major bump, and
# 0.5.5 is not avoidable from here: it arrives through
# openidconnect -> p256/p384 -> elliptic-curve 0.13 -> crypto-bigint 0.5, and
# 4.0.1 declares p256/p384 as unconditional dependencies with no feature gate.
# Everything that reaches it is ES256/ES384 *verification*
# (`openidconnect::core::crypto` builds an `ecdsa::VerifyingKey` and calls
# `verify`), so the values flowing through these branches are the signature and
# the provider's public JWKS -- both public. This tree never loads an EC private
# scalar: the only signing keys openidconnect implements are RSA, HMAC and
# Ed25519, and none of them are used here. Revisit when openidconnect moves to
# elliptic-curve 0.14 (which pulls crypto-bigint 0.7).
# RUSTSEC-2026-0459 (libsqlite3-sys 0.30.1): opening a database together with
# a sibling `-wal` whose page size differs from the database's can make ordinary
# queries return uninitialized page-cache memory. Fixed in libsqlite3-sys 0.39
# (SQLite 3.54). This one cannot be updated away: the only path that *bundles*
# SQLite here is sqlx-sqlite, and every sqlx release — including 0.9.0, the
# latest — requires `libsqlite3-sys >=0.30.1, <0.38.0`, so no sqlx version can
# carry a 0.39 dependency. The CLI adds no second copy: it does not enable
# `bundled` itself (`-p qdrust-cli` links the host's SQLite), and either way the
# file it opens is the operator's own database, not something a template or an
# import delivers.
# What the trigger needs is a crafted db + `-wal` pair written by someone less
# trusted than the operator. In SQLite mode those files live in the data
# directory the server runs as (uid 10001 in the image, or the mounted path),
# and whoever can write there already owns the rows the leak would expose.
# Switching the server to the system SQLite was considered and rejected: that
# needs a host library >= 3.54 (Debian 12 ships 3.40, itself affected) plus
# libclang for bindgen, and turns a self-contained image into a version lottery.
# Revisit when sqlx widens the range to libsqlite3-sys 0.39; the fix is then
# `cargo update -p libsqlite3-sys`.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0387", "RUSTSEC-2026-0459"]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

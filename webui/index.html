<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#f7f9fc" />
    <title>qdrust</title>
    <script>
      // Resolve the theme before first paint so the page never flashes the
      // wrong palette. Keep these colours aligned with the CSS theme tokens.
      (() => {
        const storageKey = 'qdrust-theme-mode';
        const storedMode = localStorage.getItem(storageKey);
        const themeMode = ['light', 'dark', 'system'].includes(storedMode) ? storedMode : 'system';
        const resolvedTheme =
          themeMode === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : themeMode;

        document.documentElement.setAttribute('data-theme', resolvedTheme);

        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', resolvedTheme === 'dark' ? '#222a36' : '#f7f9fc');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="qdrust">
  <title>qdrust</title>
  <style>
    /* Mirror the app palette: light theme primary, dark theme primary under
       a dark colour scheme. Browsers re-render SVG favicons on scheme change. */
    .tile { fill: #4b6bfb; }
    .gloss { opacity: 0.45; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #2f5f9e; }
      .gloss { opacity: 0.18; }
    }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b86ff" />
      <stop offset="1" stop-color="#3a57e0" />
    </linearGradient>
  </defs>
  <rect class="tile" x="0" y="0" width="64" height="64" rx="16" />
  <rect class="gloss" x="0" y="0" width="64" height="64" rx="16" fill="url(#g)" />
  <!-- lucide "zap", the same glyph used by the in-app brand mark -->
  <path
    transform="translate(9.2 9.2) scale(1.9)"
    fill="#ffffff"
    d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"
  />
</svg>

[workspace]
members = [
    "crates/qdrust-core",
    "crates/qdrust-cli",
    "crates/qdrust-server",
    "crates/qdrust-plugin-browser",
]
default-members = ["crates/qdrust-server"]
resolver = "3"

# Release version lives HERE and only here. Every workspace crate inherits it
# via `version.workspace = true`, and scripts/bump-version.py keeps the WebUI
# package + OpenAPI document + lockfiles in sync (CI runs the same script with
# --check as a drift gate).
[workspace.package]
version = "0.1.11"
edition = "2024"
license = "MIT"

# Internal path dependencies pin the release version explicitly. They must:
# a) satisfy `wildcards = "deny"` in deny.toml (a versionless path dep
#    resolves to `*`, which fails the CI cargo-deny gate), and
# b) resolve to a concrete crate for cargo-deny (versionless workspace
#    dependencies trigger its unfixable `unresolved-workspace-dependency`
#    bug diagnostic). scripts/bump-version.py rewrites these together with
#    [workspace.package], so they never drift in practice.
[workspace.dependencies]
qdrust-core = { path = "crates/qdrust-core", version = "0.1.11" }
qdrust-plugin-browser = { path = "crates/qdrust-plugin-browser", version = "0.1.11" }

[package]
name = "qdrust-server"
version = "0.1.7"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.15"
dotenvy = "0.15"
futures-util = "0.3"
qdrust-core = { path = "../qdrust-core", version = "0.1.7" }
qdrust-plugin-browser = { path = "../qdrust-plugin-browser", version = "0.1.0" }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "mysql", "migrate", "macros", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "pool", "builder"] }
http-body-util = "0.1"
redis = { version = "0.27", features = ["tokio-comp"] }
futures = "0.3"
# OIDC / OpenID Connect client (PKCE S256, discovery). Backed by reqwest 0.12
# (hyper 1 / h2 0.4) for outgoing HTTP (shared rustls stack), avoiding the
# oauth2-4/reqwest-0.11 chain that pulls the vulnerable h2 0.3.x (RUSTSEC-2026-0258).
# We never hand-roll JWT/JWKS validation.
openidconnect = { version = "4", default-features = false, features = ["reqwest"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

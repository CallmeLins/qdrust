[package]
name = "qdrust-core"
version = "0.1.4"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
ecb = { version = "0.1", features = ["alloc", "block-padding"] }
chrono = "0.4"
hex = "0.4"
html-escape = "0.2"
md5 = "0.8"
minijinja = { version = "2", features = ["loader"] }
encoding_rs = "0.8"
percent-encoding = "2"
regex = "1"
rsa = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5"] }
rand = "0.8"
fake = { version = "2", features = ["derive"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

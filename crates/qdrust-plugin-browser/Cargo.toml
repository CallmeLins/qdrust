[package]
name = "qdrust-plugin-browser"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Subprocess plugin: drive a remote headless browser over CDP (obscura / Browserless)"
publish = false

[lib]
name = "qdrust_plugin_browser"
path = "src/lib.rs"

[[bin]]
name = "qdrust-plugin-browser"
path = "src/main.rs"

[dependencies]
qdrust-core = { path = "../qdrust-core", version = "0.1.3" }
anyhow = "1"
base64 = "0.22"
chromiumoxide = "0.9"
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
